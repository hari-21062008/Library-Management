<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Library{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.user %}
<aside class="side">
  <div class="brand">Stacks<small>Library desk</small></div>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Dashboard</a>
    <a href="{{ url_for('books') }}" class="{{ 'on' if 'book' in request.endpoint and request.endpoint != 'return_book' }}">Books</a>
    <a href="{{ url_for('members') }}" class="{{ 'on' if 'member' in request.endpoint }}">Members</a>
    <a href="{{ url_for('loans') }}" class="{{ 'on' if request.endpoint in ('loans','issue','return_book') }}">Loans</a>
  </nav>
  <a class="out" href="{{ url_for('logout') }}">Log out ({{ session.user }})</a>
</aside>
{% endif %}
<main class="{{ 'with-side' if session.user }}">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
