{% extends "base.html" %}
{% block title %}{{ 'Edit' if member else 'Add' }} member{% endblock %}
{% block content %}
<h1>{{ 'Edit member' if member else 'Add member' }}</h1>
<form method="post" class="card form">
  <label>Name <input name="name" required value="{{ member.name if member }}"></label>
  <label>Email <input name="email" type="email" value="{{ member.email or '' if member }}"></label>
  <label>Phone <input name="phone" value="{{ member.phone or '' if member }}"></label>
  <div class="bar"><button class="btn">Save member</button><a class="btn ghost" href="{{ url_for('members') }}">Cancel</a></div>
</form>
{% endblock %}
